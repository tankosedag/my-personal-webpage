<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Tan Kösedağ</title>

    <style>
        :root {
            --home: #dfc49c;
            --about: #86b5df;
            --domestic: #96bb97;
            --abroad: #b49bd2;
            --ink: #243044;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f5eddf;
            color: var(--ink);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.7;
        }

        .site {
            max-width: 1320px;
            min-height: 100vh;
            margin: auto;
            background: #faf5eb;
            box-shadow: 0 0 60px #38383812;
        }

        .folder-navigation {
            background: #383838;
            padding: 28px 24px 0;
        }

        .folder-navigation ul {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .folder-navigation li {
            flex: 1;
            min-width: 0;
        }

        .folder-tab {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
            padding: 12px 22px;
            color: #26303d;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            background: var(--tab-color);
            clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 100%, 0 100%);
            transition: min-height .2s ease, color .2s ease, filter .2s ease;
        }

        .tab-home { --tab-color: var(--home); }
        .tab-about { --tab-color: var(--about); }
        .tab-domestic { --tab-color: var(--domestic); }
        .tab-abroad { --tab-color: var(--abroad); }

        .folder-tab:hover {
            min-height: 68px;
            color: #101722;
            filter: brightness(1.06);
        }

        .folder-tab[aria-current="page"] {
            min-height: 80px;
            font-weight: 700;
        }

        a:focus-visible {
            outline: 3px solid #162b4d;
            outline-offset: -7px;
        }

        .hero {
            min-height: calc(100svh - 108px);
            display: flex;
            align-items: center;
            padding: 70px clamp(28px, 8vw, 110px);
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::before {
            width: 440px;
            height: 440px;
            right: -150px;
            top: 8%;
            background: #e7d0a95c;
        }

        .hero::after {
            width: 260px;
            height: 260px;
            right: 10%;
            bottom: -130px;
            border: 1px solid #c4a16b66;
        }

        .hello {
            margin: 0 0 20px;
            font-size: clamp(55px, 9vw, 115px);
            font-weight: 300;
            letter-spacing: -5px;
            line-height: 1.1;
        }

        .welcome {
            margin: 0;
            font-size: clamp(26px, 4vw, 52px);
            font-weight: 400;
            line-height: 1.35;
            letter-spacing: -1px;
        }

        .name {
            display: inline-block;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 2px solid #c1a06a;
            font-size: clamp(22px, 3vw, 34px);
            letter-spacing: 2px;
        }

        .hero-content {
            animation: welcome-in .8s ease both;
        }

        @keyframes welcome-in {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 680px) {
            .folder-navigation { padding: 20px 8px 0; }
            .folder-navigation ul { gap: 3px; }
            .folder-tab {
                min-height: 64px;
                padding: 10px 8px;
                font-size: 11px;
                clip-path: polygon(
                    7px 0, calc(100% - 7px) 0, 100% 100%, 0 100%
                );
            }
            .folder-tab:hover { min-height: 70px; }
            .folder-tab[aria-current="page"] { min-height: 80px; }
            .hello { letter-spacing: -3px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    
        .folder-navigation {
    --tab-slope: clamp(20px, 5vw, 64px);
    padding: 0;
    background: #383838;
}

.folder-navigation ul {
    display: flex;
    align-items: flex-end;
    gap: 0;
    height: 110px;
    margin: 0;
    padding: 0;
    list-style: none;
    isolation: isolate;
}

.folder-navigation li {
    position: relative;
    flex: 1;
    min-width: 0;
    z-index: 1;
}

/* Hovered tab comes forward. */
.folder-navigation li:hover,
.folder-navigation li:focus-within {
    z-index: 5;
}

/* Active tab stays in front. */
.folder-navigation li:has([aria-current="page"]) {
    z-index: 10;
}

.folder-navigation .folder-tab {
    display: flex;
    align-items: center;
    justify-content: center;

    width: calc(100% + var(--tab-slope) * 2);
    height: 70px;
    min-height: 0;
    margin-left: calc(-1 * var(--tab-slope));
    padding: 12px calc(var(--tab-slope) + 8px);

    background: var(--tab-color);
    color: #26303d;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.3;
    text-align: center;
    text-decoration: none;

    clip-path: polygon(
        var(--tab-slope) 0,
        calc(100% - var(--tab-slope)) 0,
        100% 100%,
        0 100%
    );

    transition: height 200ms ease;
}

/* Keep the first and last tabs inside the page. */
.folder-navigation li:first-child .folder-tab {
    width: calc(100% + var(--tab-slope));
    margin-left: 0;
    padding-left: calc(var(--tab-slope) + 8px);
    padding-right: 8px;
}

.folder-navigation li:last-child .folder-tab {
    width: calc(100% + var(--tab-slope));
    padding-left: 8px;
    padding-right: calc(var(--tab-slope) + 8px);
}

/* Middle height when hovered or focused. */
.folder-navigation .folder-tab:hover,
.folder-navigation .folder-tab:focus-visible {
    height: 85px;
    min-height: 0;
    filter: none;
}

/* Highest position for the current page. */
.folder-navigation .folder-tab[aria-current="page"] {
    height: 100px;
    min-height: 0;
    font-weight: 500;
}

@media (max-width: 680px) {
    .folder-navigation ul {
        height: 95px;
    }

    .folder-navigation .folder-tab {
        height: 58px;
        font-size: 11px;
    }

    .folder-navigation .folder-tab:hover,
    .folder-navigation .folder-tab:focus-visible {
        height: 72px;
    }

    .folder-navigation .folder-tab[aria-current="page"] {
        height: 86px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .folder-navigation .folder-tab {
        transition: none;
    }
}

.folder-navigation .folder-tab,
.folder-navigation li:first-child .folder-tab,
.folder-navigation li:last-child .folder-tab {
    padding: 12px var(--tab-slope);
    justify-content: center;
    text-align: center;
    font-size: 17px;
}

.folder-navigation .folder-tab[aria-current="page"] {
    font-weight: 700;
}

@media (max-width: 680px) {
    .folder-navigation .folder-tab {
        font-size: 13px;
    }
}
    
    </style>
</head>

<body>
    <div class="site">
        <nav class="folder-navigation" aria-label="Main navigation">
            <ul>
                <li>
                    <a class="folder-tab tab-home"
                       href="home.html" aria-current="page">Home</a>
                </li>
                <li>
                    <a class="folder-tab tab-about"
                       href="me.html">About Me</a>
                </li>
                <li>
                    <a class="folder-tab tab-domestic"
                       href="tur.html">My Domestic Trips</a>
                </li>
                <li>
                    <a class="folder-tab tab-abroad"
                       href="wrld.html">My Abroad Trips</a>
                </li>
            </ul>
        </nav>

        <main class="hero">
            <div class="hero-content">
                <p class="hello">Hello</p>
                <h1 class="welcome">Welcome to My Webpage</h1>
                <p class="name">Tan Kösedağ</p>
            </div>
        </main>
    </div>
</body>
</html>
