<head>

    <title>Home | Tan Kösedağ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #e6e6e6;
            color: #444;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.75;
        }

        .site {
            max-width: 1040px;
            margin: 48px auto;
            padding: 0 40px;
            background: white;
            box-shadow: 0 2px 6px rgba(100, 100, 100, 0.3);
        }

        .site-header {
            padding: 24px 0 0;
        }

        .site-title {
            min-height: 48px;
            margin: 0;
            font-size: 26px;
        }

        .site-title a {
            color: #515151;
            text-decoration: none;
        }

        .site-description {
            margin: 0 0 24px;
            color: #757575;
            font-size: 13px;
        }

        .main-navigation {
        background-color: #eeeeee;
        padding: 0 18px;
        border-top: 1px solid #dddddd;
        border-bottom: 1px solid #dddddd;
        }

        .site-title,
        .site-title a {
        color: #162b4d;
        }

        .main-navigation ul {
            display: flex;
            flex-wrap: wrap;
            gap: 0 40px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .main-navigation a {
            display: block;
            padding: 14px 0;
            color: #6a6a6a;
            font-size: 12px;
            text-transform: uppercase;
            text-decoration: none;
            transition: color 180ms ease;
        }

        .main-navigation a:hover {
            color: #21759b;
        }

        .main-navigation a[aria-current="page"] {
            color: #444;
            font-weight: bold;
        }

        a {
            color: #21759b;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid #21759b;
            outline-offset: 4px;
        }

        main {
            padding-top: 24px;
        }

        .page-title {
            margin: 0 0 24px;
            font-size: 22px;
            font-weight: normal;
        }

        p {
            margin: 0 0 20px;
        }

        .interactive-map {
            width: 100%;
            height: 520px;
            margin: 24px 0;
            background: white;
            border: 1px solid #ededed;
        }

        .map-status {
            color: #757575;
            font-size: 13px;
        }

        .map-popup {
            position: relative;
            width: 250px;
            padding: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
        }

        .map-popup h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .map-popup p {
            margin: 0 0 10px;
        }

        .place-photo {
            display: block;
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 4px;
        }

        .popup-close {
            position: absolute;
            top: 3px;
            right: 7px;
            border: none;
            background: transparent;
            color: #555;
            font-size: 22px;
            cursor: pointer;
        }

        article {
            padding-bottom: 24px;
            border-bottom: 4px double #ededed;
        }

        .last-update {
            margin: 30px 0 0;
            color: #757575;
            font-size: 12px;
        }

        .site-footer {
            padding: 24px 0;
            color: #757575;
            font-size: 12px;
        }

        .site-footer p {
            margin: 0;
        }

        @media (max-width: 780px) {
            body {
                background: white;
            }

            .site {
                margin: 0;
                padding: 0 24px;
                box-shadow: none;
            }

            .main-navigation ul {
                gap: 0 24px;
            }

            .interactive-map {
                height: 400px;
            }
        }
    </style>
</head>

<body>
    <div class="site">
        <header class="site-header">
            <h1 class="site-title">
                <a href="home.html"></a>
            </h1>

            <p class="site-description">My Personal Website | Tan Kösedağ</p>

            <nav class="main-navigation" aria-label="Main navigation">
                <ul>
                    <li>
                        <a href="home.html" aria-current="page">Home</a>
                    </li>

                    <li>
                        <a href="tur.html">My Domestic Trips</a>
                    </li>

                    <li>
                        <a href="wrld.html">My Abroad Trips</a>
                    </li>
                </ul>
            </nav>
        </header>
        
        <main>
            <article>
                <h1 class="page-title">Home</h1>

                <section
                    class="about-section"
                    aria-labelledby="about-heading"
                >
                    <h2 id="about-heading">About Me</h2>

                    <p>Hi , my name is Tan. I am a Geomatics Engineering student at Hacettepe University.</p>
                </section>

            </article>
        </main>
</body>
</html>
